name: Hyrox Ticket Watcher

on:
  schedule:
    # Runs every 2 hours. Tune as needed — more frequent = higher detection risk.
    - cron: '0 */2 * * *'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Restore ticket status cache
        uses: actions/cache@v4
        with:
          path: hyrox_status.json
          key: hyrox-status-${{ github.run_id }}
          restore-keys: |
            hyrox-status-

      - name: Check ticket availability
        env:
          HYROX_EVENT_URL: ${{ vars.HYROX_EVENT_URL || 'https://hyrox.com/event/hyrox-tampa/' }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          STATUS_FILE: hyrox_status.json
        run: go run ./cmd/hyroxwatcher/

      - name: Save ticket status cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hyrox_status.json
          key: hyrox-status-${{ github.run_id }}
